<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 飲食計算機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自訂字體與基礎樣式設定，確保在手機上的視覺體驗類似原生 App */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 隱藏預設的檔案上傳按鈕，以便客製化 UI */
        input[type="file"] {
            display: none;
        }

        /* 載入中的旋轉動畫 */
        .loader {
            border-top-color: #3b82f6;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex justify-center pb-10">

    <div class="w-full max-w-md bg-white min-h-screen shadow-xl flex flex-col relative">
        
        <!-- 頂部導覽列 -->
        <header class="bg-blue-600 text-white p-5 shadow-md rounded-b-2xl z-10">
            <h1 class="text-2xl font-bold text-center tracking-wide">AI 飲食計算機</h1>
            <p class="text-blue-100 text-sm text-center mt-1">拍照輕鬆紀錄熱量與營養素</p>
        </header>

        <!-- 主要內容區 -->
        <main class="flex-1 p-6 flex flex-col items-center">
            
            <!-- 圖片預覽區塊 -->
            <div id="image-preview-container" class="w-full aspect-square bg-gray-100 rounded-3xl border-2 border-dashed border-gray-300 flex flex-col items-center justify-center overflow-hidden mb-6 relative shadow-inner">
                <span id="preview-placeholder" class="text-gray-400 flex flex-col items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span class="text-sm font-medium">尚未選擇照片</span>
                </span>
                <img id="image-preview" src="" alt="食物預覽" class="hidden w-full h-full object-cover">
            </div>

            <!-- 拍照/上傳按鈕 -->
            <label for="camera-input" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-lg font-semibold py-4 rounded-2xl shadow-lg transition-transform transform active:scale-95 text-center cursor-pointer flex items-center justify-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span>拍照或上傳照片</span>
            </label>
            <!-- input 標籤設定 capture="environment" 優先開啟手機後置鏡頭 -->
            <input type="file" id="camera-input" accept="image/*" capture="environment">

            <!-- 載入中動畫區塊 -->
            <div id="loading-indicator" class="hidden flex-col items-center justify-center w-full mt-8 space-y-4">
                <div class="loader border-4 border-gray-200 rounded-full w-12 h-12"></div>
                <p class="text-blue-600 font-medium animate-pulse">AI 正在分析食物營養成份...</p>
            </div>

            <!-- 分析結果區塊 -->
            <div id="results-container" class="hidden w-full mt-6 flex-col items-center animate-fade-in-up">
                <h2 id="food-name" class="text-2xl font-bold text-gray-800 mb-1 text-center">食物名稱</h2>
                <div class="bg-gray-100 text-gray-500 text-xs px-3 py-1 rounded-full mb-6">AI 估算結果僅供參考</div>
                
                <!-- 總熱量卡片 -->
                <div class="w-full bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl p-6 text-white shadow-lg mb-4 flex justify-between items-center">
                    <div>
                        <p class="text-blue-100 text-sm mb-1 font-medium">預估總熱量</p>
                        <div class="flex items-baseline space-x-1">
                            <span id="calories-val" class="text-4xl font-bold">--</span>
                            <span class="text-lg">大卡</span>
                        </div>
                    </div>
                    <div class="bg-white/20 p-3 rounded-xl backdrop-blur-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                    </div>
                </div>

                <!-- 三大營養素網格 -->
                <div class="w-full grid grid-cols-3 gap-3">
                    <!-- 蛋白質 -->
                    <div class="bg-red-50 rounded-2xl p-4 flex flex-col items-center shadow-sm border border-red-100">
                        <span class="text-red-500 text-xs font-bold mb-1">蛋白質</span>
                        <div class="flex items-baseline">
                            <span id="protein-val" class="text-xl font-bold text-gray-800">--</span>
                            <span class="text-xs text-gray-500 ml-1">g</span>
                        </div>
                    </div>
                    <!-- 碳水 -->
                    <div class="bg-yellow-50 rounded-2xl p-4 flex flex-col items-center shadow-sm border border-yellow-100">
                        <span class="text-yellow-600 text-xs font-bold mb-1">碳水</span>
                        <div class="flex items-baseline">
                            <span id="carbs-val" class="text-xl font-bold text-gray-800">--</span>
                            <span class="text-xs text-gray-500 ml-1">g</span>
                        </div>
                    </div>
                    <!-- 脂肪 -->
                    <div class="bg-orange-50 rounded-2xl p-4 flex flex-col items-center shadow-sm border border-orange-100">
                        <span class="text-orange-500 text-xs font-bold mb-1">脂肪</span>
                        <div class="flex items-baseline">
                            <span id="fat-val" class="text-xl font-bold text-gray-800">--</span>
                            <span class="text-xs text-gray-500 ml-1">g</span>
                        </div>
                    </div>
                </div>
                
                <p id="error-message" class="text-red-500 text-sm mt-4 hidden text-center w-full bg-red-100 p-3 rounded-xl"></p>
            </div>
        </main>
    </div>

    <script>
        // DOM 元素獲取
        const fileInput = document.getElementById('camera-input');
        const imagePreview = document.getElementById('image-preview');
        const previewPlaceholder = document.getElementById('preview-placeholder');
        const loadingIndicator = document.getElementById('loading-indicator');
        const resultsContainer = document.getElementById('results-container');
        const errorMessage = document.getElementById('error-message');
        
        const uiFoodName = document.getElementById('food-name');
        const uiCalories = document.getElementById('calories-val');
        const uiProtein = document.getElementById('protein-val');
        const uiCarbs = document.getElementById('carbs-val');
        const uiFat = document.getElementById('fat-val');

        // 當使用者選擇照片後觸發
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // 隱藏之前的結果與錯誤訊息
            resultsContainer.classList.add('hidden');
            errorMessage.classList.add('hidden');
            
            // 讀取圖片並顯示預覽
            const reader = new FileReader();
            reader.onload = async (event) => {
                const dataUrl = event.target.result;
                
                // 更新預覽畫面
                imagePreview.src = dataUrl;
                imagePreview.classList.remove('hidden');
                previewPlaceholder.classList.add('hidden');
                
                // 顯示載入中
                loadingIndicator.classList.remove('hidden');
                loadingIndicator.classList.add('flex');

                try {
                    // 解析 base64 資料
                    const mimeType = dataUrl.split(';')[0].split(':')[1];
                    const base64Data = dataUrl.split(',')[1];
                    
                    // 呼叫 Gemini API 分析圖片
                    await analyzeFoodImage(base64Data, mimeType);
                } catch (error) {
                    console.error("Analysis failed:", error);
                    showError("分析失敗，請確認網路連線或稍後再試。");
                } finally {
                    // 隱藏載入中
                    loadingIndicator.classList.add('hidden');
                    loadingIndicator.classList.remove('flex');
                }
            };
            reader.readAsDataURL(file);
        });

        // 呼叫 Gemini API 進行圖像辨識
        async function analyzeFoodImage(base64Data, mimeType) {
            // 在這裡填入你的 API Key，環境自動注入
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            // 設定給 Gemini 的指令，並要求強制回傳 JSON 格式
            const prompt = "你是一個專業的營養師。請分析這張圖片中的食物，並預估它的名稱以及大致的營養成分。請務必直接回傳 JSON 格式，不要包含其他文字或 Markdown 標記，若無法辨識請回傳預設值。";
            
            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: prompt },
                            {
                                inlineData: {
                                    mimeType: mimeType,
                                    data: base64Data
                                }
                            }
                        ]
                    }
                ],
                // 強制要求回傳結構化 JSON 資料
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            "name": { type: "STRING", description: "食物的名稱" },
                            "calories": { type: "INTEGER", description: "預估總熱量(大卡)" },
                            "protein": { type: "INTEGER", description: "預估蛋白質(公克)" },
                            "fat": { type: "INTEGER", description: "預估脂肪(公克)" },
                            "carbs": { type: "INTEGER", description: "預估碳水化合物(公克)" }
                        },
                        required: ["name", "calories", "protein", "fat", "carbs"]
                    }
                }
            };

            // 實作簡單的重試機制處理 API 限制 (Exponential Backoff)
            let retries = 3;
            let delay = 1000;
            
            while (retries > 0) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 429) {
                            throw new Error("Too Many Requests");
                        }
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    
                    if (result.candidates && result.candidates.length > 0 && 
                        result.candidates[0].content && result.candidates[0].content.parts.length > 0) {
                        
                        const jsonText = result.candidates[0].content.parts[0].text;
                        const foodData = JSON.parse(jsonText);
                        
                        updateUI(foodData);
                        return; // 成功解析，跳出迴圈
                    } else {
                        throw new Error("API response structure is invalid.");
                    }
                } catch (error) {
                    retries--;
                    if (retries === 0) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2; // 指數退避延遲
                }
            }
        }

        // 將取得的資料更新到畫面上
        function updateUI(data) {
            uiFoodName.textContent = data.name || "未知食物";
            uiCalories.textContent = data.calories !== undefined ? data.calories : "--";
            uiProtein.textContent = data.protein !== undefined ? data.protein : "--";
            uiFat.textContent = data.fat !== undefined ? data.fat : "--";
            uiCarbs.textContent = data.carbs !== undefined ? data.carbs : "--";
            
            // 顯示結果區塊
            resultsContainer.classList.remove('hidden');
            resultsContainer.classList.add('flex');
        }

        // 顯示錯誤訊息
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden');
            errorMessage.classList.add('block');
        }
    </script>
</body>
</html>
